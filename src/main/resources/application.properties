spring.application.name=FacturacionElectronica
server.port=${SERVER_PORT:8080}

# Perfil local listo para ejecutar sin instalar una base de datos externa.
# Los datos se persisten en ./data/facturaciondb.
spring.datasource.url=${DB_URL:jdbc:h2:file:./facturaciondb;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 solo para desarrollo local.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT. En despliegue real se debe definir JWT_SECRET por variable de entorno.
security.jwt.secret=${JWT_SECRET:ParkSmart-Facturacion-Local-2026-Secret-Key-Change-In-Production}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Integraciones externas. El modo SIMULADO permite probar todo el flujo en Postman
# mientras los grupos responsables publican sus APIs reales.
integraciones.modo=${INTEGRACIONES_MODO:SIMULADO}
integraciones.firma-url=${FIRMA_API_URL:}
integraciones.dgtd-url=${DGTD_API_URL:}
integraciones.xml-validator-url=${XML_VALIDATOR_API_URL:}

# CORS para desarrollo. En producción limitar al dominio real.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# BankyFinanzas (pasarela utilizada por el backend/checkout compartido del curso).
# MERCHANT_ID no es una clave secreta, pero debe corresponder al comercio de este grupo.
integraciones.banky-url=${BANKY_URL:https://bankyfinanzas.netlify.app}
integraciones.banky-merchant-id=${BANKY_MERCHANT_ID:}
integraciones.banky-currency=${BANKY_CURRENCY:CRC}

# API compartida de "Factura Bonita" del curso.
# Se consume solo al solicitar el PDF/HTML visual; el PDF local original se mantiene intacto.
integraciones.factura-bonita-url=${FACTURA_BONITA_URL:https://proyecto-kn7p.onrender.com}
integraciones.factura-bonita-origen=${FACTURA_BONITA_ORIGEN:facturasmart}
